# lazygit configuration
# Reference: https://github.com/jesseduffield/lazygit/blob/master/docs/Config.md
#            https://github.com/jesseduffield/lazygit/blob/master/docs/Custom_DiffRenderers.md
# Press | inside lazygit to cycle between the renderers below.

git:
  diffRenderers:
    # delta: syntax-highlighted diffs with line numbers. "ansi" uses the terminal's
    # 16 colors, so it follows the Minimal Ink scheme like lazygit itself.
    # lazygit 0.65 does not support the {{colorScheme}} template yet, so --dark is explicit.
    - name: delta
      command: delta --dark --paging=never --line-numbers --syntax-theme ansi
    # git's own diff, kept as a fallback.
    - type: rawGit
      name: default
