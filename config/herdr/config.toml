# Herdr configuration
# Reference: herdr --default-config | https://herdr.dev/docs/configuration/
# Apply changes to a running server: herdr server reload-config

# Skip the first-run setup wizard.
onboarding = false

# Minimalism: one ink, one paper, no accent hue. Hierarchy comes from contrast only;
# status colors are desaturated. Follows the Windows Terminal light/dark appearance.
[theme]
name = "tokyo-night"
auto_switch = true
dark_name = "tokyo-night"
light_name = "catppuccin-latte"

[theme.custom.dark]
panel_bg = "#121212"
sidebar_bg = "#121212"
active_row_bg = "#1e1e1e"
selection_bg = "#2a2a2a"
surface_dim = "#222222"
text = "#e6e6e6"
accent = "#d4d4d4"
green = "#8fbf8f"
blue = "#8fb0d9"
red = "#d98c8c"
yellow = "#d9c48c"

[theme.custom.light]
panel_bg = "#fafafa"
sidebar_bg = "#fafafa"
active_row_bg = "#efefef"
selection_bg = "#e4e4e4"
surface_dim = "#e6e6e6"
text = "#1a1a1a"
accent = "#1a1a1a"
green = "#4f8f4f"
blue = "#3f6fa8"
red = "#b04a4a"
yellow = "#a88a2a"

[ui.toast]
# Deliver agent notifications (done / needs input) through the Windows
# notification service. Clicking a notification brings the Herdr window forward.
delivery = "system"

[ui.sound]
# Play a chime when an agent finishes and an alert when it needs input.
# Only applies to agents in background workspaces.
enabled = true

[session]
# Resume supported agent conversations (e.g. claude --resume <id>) after a
# server restart. Requires the official integration for each agent.
resume_agents_on_restore = true

[experimental]
# Keep each pane's screen content across a full server restart.
pane_history = true

[terminal]
# Windows Terminal does not support the Kitty graphics protocol.
kitty_graphics = false
# Use PowerShell 7 for new panes. The Store (MSIX) pwsh is only reachable through the
# WindowsApps alias and herdr's auto-detection fell back to Windows PowerShell 5.1.
default_shell = "pwsh.exe"

# Focus layout: sidebar starts as a compact status rail (toggle with prefix+b),
# no outer frame, no scrollbars, tab row hidden while a workspace has one tab.
[ui]
sidebar_start_collapsed = true
sidebar_collapsed_mode = "compact"
pane_outer_borders = false
pane_scrollbars = false
hide_tab_bar_when_single_tab = true

# lazygit runs INSIDE the focused pane, exactly as if typed there.
# `herdr pane run` types the command plus Enter into the pane, so no split is created.
# Focus a shell pane first: the text goes to whatever runs in that pane.
# Commands run through cmd.exe /d /c, hence the %VAR% syntax.
[[keys.command]]
key = "prefix+alt+g"
type = "shell"
command = '"%HERDR_BIN_PATH%" pane run %HERDR_ACTIVE_PANE_ID% lazygit'
description = "lazygit in focused pane"

# glow and yazi open in a temporary pane next to the focused one; the pane closes
# when the tool exits (q). Use prefix+z to zoom it.
[[keys.command]]
key = "prefix+alt+m"
type = "pane"
command = "glow"
description = "glow (markdown reader)"

[[keys.command]]
key = "prefix+alt+f"
type = "pane"
command = "yazi"
description = "yazi (file browser)"
